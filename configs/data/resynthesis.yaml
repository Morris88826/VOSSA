data:
  class_path: data_modules.ResynthesisDataModule
  init_args:
    source_data_dir: /data/mtseng/voice_datasets/LibriTTS/data
    target_data_dir:
      - /data/mtseng/voice_datasets/voxceleb1/data
      - /data/mtseng/voice_datasets/voxceleb2/data
